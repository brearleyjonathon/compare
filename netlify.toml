# Netlify configuration for Compare.
# The site is a single static HTML file, so there is no build step: the repository root is published as-is.

[build]
  publish = "."
  command = ""

# Serve the app for the bare site URL.
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

# Security headers. The app is self-contained: inline script and style, no external resources,
# blob: URLs for the "Save" downloads and data: URLs for icons.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Always revalidate the app itself so updates show up immediately.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Icons and images change rarely; cache them for a day.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
